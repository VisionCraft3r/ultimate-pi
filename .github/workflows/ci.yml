name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan
      - run: |
          if ! command -v tmux; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
      - run: npm run smoke
