name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Install tmux (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if ! command -v tmux; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux; then
            brew install tmux
          fi
      - run: npm run typecheck
      - name: Run tests
        # Node 24 process isolation plus the doctor check marks corrupts the
        # test runner IPC. scripts/run-tests.mjs keeps Node 24 in-process and
        # Node 22 at one file at a time.
        run: npm test
      - run: npm run scan
      - run: npm run smoke
