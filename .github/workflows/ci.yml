name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - name: Install tmux (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if ! command -v tmux; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux; then
            brew install tmux
          fi
      - run: npm run typecheck
      - name: Run tests
        # Known Node test-runner flake: test/installer-packages.test.ts spawns
        # child processes that print the CLI's ASCII-art banner (large
        # multi-byte stdout), which intermittently corrupts the test runner's
        # internal IPC framing ("Unable to deserialize cloned data due to
        # invalid or unsupported version"). Confirmed unrelated to app code:
        # the file passes reliably in isolation and at --test-concurrency=1.
        # Retry once rather than let an upstream runtime flake fail CI.
        run: npm test || npm test
      - run: npm run scan
      - run: npm run smoke
